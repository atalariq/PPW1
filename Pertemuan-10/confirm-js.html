<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPW1 Student Verification</title>
    <style>
        /* --- Reset & base --- */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* --- Card --- */
        .card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            padding: 40px 32px;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 4px;
            color: #1a1a2e;
        }

        .subtitle {
            color: #64748b;
            font-size: 0.9rem;
            margin-bottom: 24px;
        }

        hr {
            border: none;
            border-top: 1px solid #e2e8f0;
            margin-bottom: 28px;
        }

        /* --- Start button --- */
        .btn-start {
            background: #3b82f6;
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 14px 36px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }
        .btn-start:hover { background: #2563eb; }
        .btn-start:active { transform: scale(0.97); }

        /* --- Secondary button (retry) --- */
        .btn-secondary {
            background: transparent;
            color: #3b82f6;
            border: 2px solid #3b82f6;
            border-radius: 10px;
            padding: 10px 28px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 16px;
        }
        .btn-secondary:hover { background: #eff6ff; }
        .btn-secondary:active { transform: scale(0.97); }

        /* --- Success message --- */
        .msg-success {
            color: #16a34a;
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 20px;
        }

        /* --- Error / denied message --- */
        .msg-denied {
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 12px;
            padding: 24px 20px;
            margin-bottom: 12px;
        }
        .msg-denied h3 {
            color: #dc2626;
            font-size: 1.2rem;
            margin-bottom: 8px;
        }
        .msg-denied p {
            color: #7f1d1d;
            font-size: 0.95rem;
            font-style: italic;
        }

        /* --- Warning (cancelled) --- */
        .msg-warning {
            color: #d97706;
            font-size: 1rem;
            margin-bottom: 16px;
        }

        /* --- Table --- */
        .table-wrap {
            overflow-x: auto;
            margin: 16px 0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }
        thead th {
            background: #f0fdf4;
            color: #166534;
            padding: 12px 16px;
            text-align: left;
            font-weight: 700;
            border-bottom: 2px solid #bbf7d0;
        }
        tbody td {
            padding: 12px 16px;
            border-bottom: 1px solid #e2e8f0;
            text-align: left;
        }
        tbody tr:last-child td { border-bottom: none; }
        tbody tr:nth-child(even) { background: #f8fafc; }

        .footer-note {
            color: #64748b;
            font-size: 0.85rem;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>PPW1 Lab</h1>
        <p class="subtitle">Student identity verification</p>
        <hr>

        <!-- Dynamic output area -->
        <div id="output-area">
            <p style="color: #475569; margin-bottom: 20px; font-size: 1.05rem;">
                Click the button below to start verification.
            </p>
            <button class="btn-start" onclick="verifyStudent()">Start Verification</button>
        </div>
    </div>

    <script>
        function verifyStudent() {
            // --- STEP 1: Confirm if student is PPW1 ---
            let isStudent = confirm("Are you a PPW1 student?");

            let output = document.getElementById("output-area");

            if (isStudent === true) {
                // --- YES: Collect data via prompt ---
                let name = prompt("Enter your name:", "Atalariq Barra Hadinugraha");
                let nim  = prompt("Enter your NIM (student ID):", "25/557554/SV/26192");
                let year = prompt("Enter your enrollment year:", "2025");

                // Check if user cancelled any prompt
                if (name === null || nim === null || year === null) {
                    output.innerHTML = `
                        <p class="msg-warning">⚠ Input cancelled. Please try again.</p>
                        <button class="btn-secondary" onclick="verifyStudent()">Try Again</button>
                    `;
                    return;
                }

                // Display data in a table
                output.innerHTML = `
                    <p class="msg-success">✔ Verified as PPW1 student</p>
                    <div class="table-wrap">
                        <table>
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>NIM</th>
                                    <th>Year</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>${escapeHtml(name)}</td>
                                    <td>${escapeHtml(nim)}</td>
                                    <td>${escapeHtml(year)}</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <p class="footer-note">Data recorded. Happy lab work!</p>
                    <button class="btn-secondary" onclick="verifyStudent()">Verify Again</button>
                `;

                console.log("=== Student Data ===");
                console.log("Name:", name);
                console.log("NIM:", nim);
                console.log("Year:", year);

            } else {
                // --- NO: Show access denied ---
                output.innerHTML = `
                    <div class="msg-denied">
                        <h3>⛔ Access Denied</h3>
                        <p>"You are not a PPW1 student, you may not enter!"</p>
                    </div>
                    <button class="btn-secondary" onclick="verifyStudent()">Try Again</button>
                `;

                console.log("Access denied: not a PPW1 student.");
            }
        }

        // --- Helper: escape HTML to prevent XSS ---
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.appendChild(document.createTextNode(text));
            return div.innerHTML;
        }
    </script>

</body>
</html>
