<!doctype html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Formulir Pendaftaran Keanggotaan Mahasiswa</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body class="bg-light py-5">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-8">

        <h2 class="text-center mb-4">Formulir Pendaftaran Keanggotaan Mahasiswa</h2>

        <!-- Alert sukses (default tersembunyi via d-none) -->
        <div class="alert alert-success alert-dismissible fade d-none" role="alert" id="alertSukses">
          <strong>Berhasil!</strong> Data mahasiswa telah disimpan.
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Tutup"></button>
        </div>

        <form class="card p-4 shadow-sm">

          <!-- Baris 1: Nama & NIM (2 kolom) -->
          <div class="row mb-3">
            <div class="col-md-6 mb-3 mb-md-0">
              <label for="nama" class="form-label">Nama Lengkap</label>
              <input type="text" class="form-control is-valid" id="nama" value="Atalariq Barra Hadinugraha" required />
              <div class="valid-feedback">Nama valid.</div>
            </div>
            <div class="col-md-6">
              <label for="nim" class="form-label">NIM</label>
              <input type="text" class="form-control is-valid" id="nim" value="25/557554/SV/26192" required />
              <div class="valid-feedback">NIM valid.</div>
            </div>
          </div>

          <!-- Baris 2: Email & Program Studi -->
          <div class="row mb-3">
            <div class="col-md-6 mb-3 mb-md-0">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control" id="email" placeholder="johndoe@mail.ugm.ac.id" />
            </div>
            <div class="col-md-6">
              <label for="prodi" class="form-label">Program Studi</label>
              <select class="form-select" id="prodi">
                <option value="" selected disabled>Pilih Program Studi</option>
                <option value="TRE">Teknologi Rekayasa Elektro</option>
                <option value="TRI">Teknologi Rekayasa Internet</option>
                <option value="TRIK">Teknologi Rekayasa Intrumentasi dan Kontrol</option>
                <option value="TRPL">Teknologi Rekayasa Perangkat Lunak</option>
              </select>
            </div>
          </div>

          <!-- Baris 3: Semester & Foto Profil -->
          <div class="row mb-3">
            <div class="col-md-6 mb-3 mb-md-0">
              <label for="semester" class="form-label">Semester</label>
              <select class="form-select" id="semester">
                <option value="" selected disabled>Pilih Semester</option>
                <option value="1">Semester 1</option>
                <option value="2">Semester 2</option>
                <option value="3">Semester 3</option>
                <option value="4">Semester 4</option>
                <option value="5">Semester 5</option>
                <option value="6">Semester 6</option>
                <option value="7">Semester 7</option>
                <option value="8">Semester 8</option>
              </select>
            </div>
            <div class="col-md-6">
              <label for="foto" class="form-label">Foto Profil</label>
              <input type="file" class="form-control" id="foto" accept="image/*" />
            </div>
          </div>

          <!-- Baris 4: Alamat -->
          <div class="mb-4">
            <label for="alamat" class="form-label">Alamat</label>
            <textarea class="form-control is-invalid" id="alamat" rows="3" placeholder="Masukkan alamat lengkap"
              required></textarea>
            <div class="invalid-feedback">Alamat tidak boleh kosong.</div>
          </div>

          <!-- Tombol Simpan & Reset (d-flex + gap) -->
          <div class="d-flex gap-2">
            <button type="button" class="btn btn-success flex-fill">Simpan</button>
            <button type="reset" class="btn btn-secondary flex-fill">Reset</button>
          </div>

        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
