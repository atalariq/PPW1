<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Components</title>
  <link rel="stylesheet" href="tugas-3.css">
</head>
<body>

  <h1>Interactive Demo</h1>

  <section class="section">
    <h2>Button Hover</h2>
    <div class="btn-group">
      <button class="btn btn-color">Color</button>
      <button class="btn btn-transform">Transform</button>
      <button class="btn btn-shadow">Shadow</button>
    </div>
  </section>

  <section class="section">
    <h2>Loading Spinner</h2>
    <div class="spinner"></div>
  </section>

  <section class="section">
    <h2>Fade In</h2>
    <div class="fade-in-element">
      fade-in element
    </div>
  </section>

</body>
</html>
